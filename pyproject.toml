[project]
name = "hollow-lore-master"
version = "0.1.0"
description = "Hollow Knight lore Q&A bot built with LangChain (LCEL chat + RAG)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch==2.13.0+cpu",
    "bs4>=0.0.2",
    "gradio>=5.42.0,<6.0.0",   # pinned - the ChatInterface API changed (removed `type` kwarg) in 6.20.0
    "langchain>=1.3.9",
    "langchain-chroma>=1.1.0",   # dev/test only - test_retriever.py uses a local Chroma store, production uses Pinecone
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.7",
    "langchain-huggingface>=1.2.2",
    "langchain-openrouter>=0.2.3",
    "langchain-pinecone>=0.2.13",
    "pinecone>=7.3.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.5.1",
    "tqdm>=4.68.2",
]   # managed in requirements.txt

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["source/lore_master", "source/evaluation"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
